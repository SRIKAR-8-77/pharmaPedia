services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmasignal_db
    environment:
      POSTGRES_USER: pharmasignal
      POSTGRES_PASSWORD: pharmasignal_secret
      POSTGRES_DB: pharmasignal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmasignal"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pharmasignal_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: pharmasignal_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://pharmasignal:pharmasignal_secret@postgres:5432/pharmasignal
      - DATABASE_URL_SYNC=postgresql://pharmasignal:pharmasignal_secret@postgres:5432/pharmasignal
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    working_dir: /app
    restart: unless-stopped

  celery_worker:
    build: ./backend
    container_name: pharmasignal_worker
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2 -Q celery,pipeline,scrape
    environment:
      - DATABASE_URL=postgresql+asyncpg://pharmasignal:pharmasignal_secret@postgres:5432/pharmasignal
      - DATABASE_URL_SYNC=postgresql://pharmasignal:pharmasignal_secret@postgres:5432/pharmasignal
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    working_dir: /app
    restart: unless-stopped

  celery_beat:
    build: ./backend
    container_name: pharmasignal_beat
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://pharmasignal:pharmasignal_secret@postgres:5432/pharmasignal
      - DATABASE_URL_SYNC=postgresql://pharmasignal:pharmasignal_secret@postgres:5432/pharmasignal
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    working_dir: /app
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: pharmasignal_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
