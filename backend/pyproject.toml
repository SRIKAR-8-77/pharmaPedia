[project]
name = "pharmasignal"
version = "1.0.0"
description = "Real-Time Social Intelligence Platform for Patient Safety"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    # Database
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "psycopg2-binary==2.9.9",
    # Task queue
    "celery[redis]==5.4.0",
    "redis==5.1.0",
    # Reddit ingestion
    "praw==7.7.1",
    # RSS feed
    "feedparser==6.0.11",
    # HTTP client
    "httpx==0.27.2",
    "aiohttp==3.10.5",
    # Config
    "python-dotenv==1.0.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    # AI (Phase 4+)
    "anthropic==0.34.2",
    # Source discovery — free, no API key (replaces SerpAPI)
    "duckduckgo-search==6.3.4",
    # Utilities
    "websockets==13.0.1",
    "orjson==3.10.7",
]

[dependency-groups]
# Install with: uv pip install -r requirements-ml.txt
ml = [
    "ftfy==6.2.0",
    "langdetect==1.0.9",
    "presidio-analyzer==2.2.354",
    "presidio-anonymizer==2.2.354",
    "spacy==3.7.6",
    "scispacy==0.5.4",
    "medspacy==1.2.0",
    "transformers==4.44.2",
    "torch==2.4.1",
    "datasketch==1.6.5",
    "faiss-cpu==1.8.0",
    "sentence-transformers==3.1.1",
]
# Install with: uv pip install scrapy playwright fake-useragent
scraping = [
    "scrapy==2.11.2",
    "playwright==1.47.0",
    "fake-useragent==1.5.1",
]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[tool.uv]
package = false
